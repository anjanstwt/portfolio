<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1300" fill="currentColor" shape-rendering="crispEdges">
  <!-- Anjan Suman — hourglass on an 11x13 grid, 100u cells. Top chamber hollow, bottom chamber full. -->
  <rect x="0" y="0" width="1100" height="200"/>
  <rect x="100" y="200" width="200" height="100"/><rect x="800" y="200" width="200" height="100"/>
  <rect x="200" y="300" width="200" height="100"/><rect x="700" y="300" width="200" height="100"/>
  <rect x="300" y="400" width="200" height="100"/><rect x="600" y="400" width="200" height="100"/>
  <rect x="400" y="500" width="300" height="100"/>
  <rect x="500" y="600" width="100" height="100"/>
  <rect x="400" y="700" width="300" height="100"/>
  <rect x="300" y="800" width="500" height="100"/>
  <rect x="200" y="900" width="700" height="100"/>
  <rect x="100" y="1000" width="900" height="100"/>
  <rect x="0" y="1100" width="1100" height="200"/>
</svg>
